<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGris | Shadowed Therapist</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0a0f;
            --secondary-dark: #12121a;
            --accent-purple: #6366f1;
            --accent-glow: #818cf8;
            --glass-bg: rgba(18, 18, 26, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .bg-gradient {
            position: absolute;
            width: 150%;
            height: 150%;
            top: -25%;
            left: -25%;
            background: radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 40% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
            animation: bgFloat 20s ease-in-out infinite;
        }

        @keyframes bgFloat {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, 2%) rotate(1deg); }
            66% { transform: translate(-1%, 1%) rotate(-1deg); }
        }

        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(99, 102, 241, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; }
        }

        /* Layout */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, var(--accent-glow) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(99, 102, 241, 0.5);
            animation: glowPulse 3s ease-in-out infinite;
            letter-spacing: 4px;
        }

        @keyframes glowPulse {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            padding: 8px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 0.85rem;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Chat Container */
        .chat-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }

        .chat-container {
            flex: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 30px;
            overflow-y: auto;
            max-height: 60vh;
            min-height: 400px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 10px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        /* Messages */
        .message {
            margin-bottom: 24px;
            opacity: 0;
            transform: translateY(20px);
            animation: messageSlide 0.5s ease forwards;
        }

        @keyframes messageSlide {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
        }

        .avatar::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.2));
        }

        .user-avatar {
            background: linear-gradient(135deg, var(--accent-purple), #8b5cf6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .igris-avatar {
            background: linear-gradient(135deg, #1e1b4b, #312e81);
            border: 2px solid rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .message-author {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .message-content {
            margin-left: 52px;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            border-top-left-radius: 4px;
            line-height: 1.6;
            font-size: 0.95rem;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }

        .message-content::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        }

        .igris-message .message-content {
            background: rgba(99, 102, 241, 0.08);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .igris-message .message-content::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, transparent 70%);
            animation: shimmer 3s infinite;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            align-items: center;
            gap: 4px;
            padding: 20px;
            margin-left: 52px;
        }

        .typing-indicator.active {
            display: flex;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-purple);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out both;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Area */
        .input-wrapper {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-field {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px 20px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            min-height: 56px;
            max-height: 150px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 56px;
            height: 56px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent-purple), #8b5cf6);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .send-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .send-btn:hover::before {
            left: 100%;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.6);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .send-btn svg {
            width: 24px;
            height: 24px;
            transition: transform 0.3s ease;
        }

        .send-btn:hover svg {
            transform: translateX(3px);
        }

        /* Energy Bar */
        .energy-bar {
            margin-top: 20px;
            padding: 16px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            backdrop-filter: blur(10px);
        }

        .energy-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .energy-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
            border-radius: 10px;
            transition: width 0.5s ease;
            position: relative;
            box-shadow: 0 0 10px currentColor;
        }

        .energy-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: energyShine 2s infinite;
        }

        @keyframes energyShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Mood Indicator */
        .mood-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent-glow);
            text-transform: capitalize;
        }

        /* Welcome Screen */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, var(--accent-purple), #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.4);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome h2 {
            font-family: 'Cinzel', serif;
            color: var(--text-primary);
            margin-bottom: 12px;
            font-size: 1.5rem;
        }

        .welcome p {
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .container {
                padding: 15px;
            }

            .chat-container {
                padding: 20px;
                max-height: 50vh;
            }

            .message-content {
                margin-left: 0;
                margin-top: 8px;
            }

            .message-header {
                flex-wrap: wrap;
            }

            .typing-indicator {
                margin-left: 0;
            }

            .input-wrapper {
                padding: 15px;
            }

            .input-field {
                padding: 12px 16px;
            }

            .send-btn {
                width: 48px;
                height: 48px;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 15px;
            }

            .subtitle {
                font-size: 0.75rem;
            }

            .chat-container {
                border-radius: 16px;
                padding: 15px;
            }
        }

        /* Scroll to bottom button */
        .scroll-bottom {
            position: fixed;
            bottom: 140px;
            right: 30px;
            width: 44px;
            height: 44px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .scroll-bottom.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .scroll-bottom:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: var(--accent-purple);
            transform: translateY(-2px);
        }

        /* Error Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 16px 24px;
            background: rgba(239, 68, 68, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 12px;
            color: white;
            font-size: 0.9rem;
            transform: translateX(150%);
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(239, 68, 68, 0.3);
        }

        .toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-gradient"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="container">
        <header>
            <h1 class="logo">IGRIS</h1>
            <p class="subtitle">The Shadowed Therapist</p>
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span id="statusText">Shadows Awakened</span>
                <span style="margin: 0 8px;">•</span>
                <span id="moodDisplay" class="mood-badge">Neutral</span>
            </div>
        </header>

        <div class="chat-wrapper">
            <div class="chat-container" id="chatContainer">
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
                        </svg>
                    </div>
                    <h2>Welcome, Mortal</h2>
                    <p>I am IGris, forged in silence to guide you through the shadows. Speak your mind, and I shall offer truth wrapped in ancient wisdom.</p>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>

            <div class="input-wrapper">
                <div class="input-container">
                    <textarea 
                        class="input-field" 
                        id="userInput" 
                        placeholder="Speak to the shadows..." 
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="energy-bar">
                <div class="energy-label">
                    <span>Shadow Energy</span>
                    <span id="energyValue">100%</span>
                </div>
                <div class="energy-track">
                    <div class="energy-fill" id="energyFill" style="width: 100%"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="scroll-bottom" id="scrollBottom" onclick="scrollToBottom()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
    </button>

    <div class="toast" id="toast"></div>

    <script>
        // Create floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (15 + Math.random() * 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Elements
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const typingIndicator = document.getElementById('typingIndicator');
        const welcome = document.getElementById('welcome');
        const energyFill = document.getElementById('energyFill');
        const energyValue = document.getElementById('energyValue');
        const moodDisplay = document.getElementById('moodDisplay');
        const scrollBottomBtn = document.getElementById('scrollBottom');
        const toast = document.getElementById('toast');

        let isTyping = false;
        let userId = null;

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 150) + 'px';
        });

        // Enter to send, Shift+Enter for new line
        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Scroll handling
        chatContainer.addEventListener('scroll', () => {
            const isNearBottom = chatContainer.scrollHeight - chatContainer.scrollTop - chatContainer.clientHeight < 100;
            scrollBottomBtn.classList.toggle('visible', !isNearBottom);
        });

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function getCurrentTime() {
            return new Date().toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
        }

        function createMessage(text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'igris-message'}`;
            
            const avatarClass = isUser ? 'user-avatar' : 'igris-avatar';
            const author = isUser ? 'You' : 'IGris';
            const initial = isUser ? 'Y' : 'I';
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <div class="avatar ${avatarClass}">${initial}</div>
                    <div>
                        <div class="message-author">${author}</div>
                        <div class="message-time">${getCurrentTime()}</div>
                    </div>
                </div>
                <div class="message-content">${escapeHtml(text)}</div>
            `;
            
            return messageDiv;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateState(state) {
            if (state.energy !== undefined) {
                const energy = Math.max(0, Math.min(100, state.energy));
                energyFill.style.width = energy + '%';
                energyValue.textContent = Math.round(energy) + '%';
                
                // Change color based on energy
                if (energy > 60) {
                    energyFill.style.background = 'linear-gradient(90deg, #10b981, #34d399)';
                } else if (energy > 30) {
                    energyFill.style.background = 'linear-gradient(90deg, #f59e0b, #fbbf24)';
                } else {
                    energyFill.style.background = 'linear-gradient(90deg, #ef4444, #f87171)';
                }
            }
            
            if (state.mood) {
                moodDisplay.textContent = state.mood;
                const moods = {
                    'protective': '🛡️',
                    'tense': '⚔️',
                    'calm': '☯️',
                    'neutral': '⚫'
                };
                moodDisplay.textContent = (moods[state.mood] || '⚫') + ' ' + state.mood;
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || isTyping) return;

            // Hide welcome on first message
            if (welcome) {
                welcome.style.display = 'none';
            }

            // Add user message
            chatContainer.appendChild(createMessage(text, true));
            userInput.value = '';
            userInput.style.height = 'auto';
            scrollToBottom();

            // Show typing indicator
            isTyping = true;
            sendBtn.disabled = true;
            typingIndicator.classList.add('active');
            scrollToBottom();

            try {
                const response = await fetch('https://igris-the-crimson-counsil-api-production.up.railway.app/igris', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ input: text })
                });

                if (!response.ok) throw new Error('Shadows are unstable');

                const data = await response.json();
                
                // Hide typing indicator
                typingIndicator.classList.remove('active');
                
                // Add IGris response
                setTimeout(() => {
                    chatContainer.appendChild(createMessage(data.IGris, false));
                    scrollToBottom();
                    
                    // Update state if available
                    if (data.state) {
                        updateState(data.state);
                    }
                    if (data.user_id) {
                        userId = data.user_id;
                    }
                }, 300);

            } catch (error) {
                typingIndicator.classList.remove('active');
                showToast('The shadows are unstable... try again, mortal.');
                console.error('Error:', error);
            } finally {
                isTyping = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Initial focus
        userInput.focus();

        // Simulate initial state update
        updateState({ energy: 100, mood: 'neutral' });
    </script>
</body>
</html>
