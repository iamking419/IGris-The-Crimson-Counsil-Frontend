<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGRIS | Shadow Counsel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --panel-bg: #0c0c0c;
      --igris-red: #9e0000;
      --border-color: #1a1a1a;
      --text-primary: #e2e2e2;
      --text-secondary: #777;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Quicksand', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      /* Subtle noise texture */
      background-image: url("https://www.transparenttextures.com/patterns/dark-matter.png");
    }

    /* Main Interface */
    .interface {
      width: 460px;
      height: 85vh;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    }

    /* Top Bar: Tactical & Stoic */
    .top-bar {
      padding: 25px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      flex-direction: column;
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 5px;
      margin: 0;
      color: #fff;
    }

    .brand span {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--igris-red);
      font-weight: bold;
      margin-top: 5px;
    }

    .vitals {
      text-align: right;
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .vitals div span {
      color: var(--text-primary);
    }

    /* Message Theater */
    .theater {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 30px;
      scrollbar-width: none; /* Firefox */
    }

    .theater::-webkit-scrollbar { display: none; }

    .msg-group {
      display: flex;
      flex-direction: column;
      animation: slideUp 0.4s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    /* IGris Style */
    .igris-msg .msg-header { color: var(--igris-red); }
    .igris-msg .msg-content {
      border-left: 1px solid var(--igris-red);
      padding-left: 15px;
      color: #ccc;
      line-height: 1.6;
      font-weight: 300;
    }

    /* User Style */
    .user-msg { align-self: flex-end; width: 80%; }
    .user-msg .msg-header { color: var(--text-secondary); text-align: right; }
    .user-msg .msg-content {
      text-align: right;
      color: #666;
      font-style: italic;
    }

    /* Command Input */
    .command-zone {
      padding: 25px;
      background: #080808;
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #222;
      padding-bottom: 5px;
      transition: border-color 0.3s;
    }

    .input-wrapper:focus-within {
      border-color: var(--igris-red);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 0;
      font-family: inherit;
      outline: none;
      font-size: 0.9rem;
    }

    .send-btn {
      background: transparent;
      border: none;
      color: var(--igris-red);
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      opacity: 0.6;
      transition: 0.3s;
    }

    .send-btn:hover {
      opacity: 1;
    }

    /* Mood indicators for the top bar */
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--igris-red);
      margin-right: 5px;
      box-shadow: 0 0 5px var(--igris-red);
    }

  </style>
</head>
<body>

<div class="interface">
  <div class="top-bar">
    <div class="brand">
      <h1>IGRIS</h1>
      <span>THE CRIMSON COUNSEL</span>
    </div>
    <div class="vitals">
      <div>MOOD: <span id="mood">STOIC</span></div>
      <div>CORE: <span id="energy">100%</span></div>
    </div>
  </div>

  <div id="theater" class="theater">
    <div class="msg-group igris-msg">
      <div class="msg-header">Commander IGris</div>
      <div class="msg-content">
        I am the shield that guards your mind. Speak your burdens, and I shall cut through them.
      </div>
    </div>
  </div>

  <div class="command-zone">
    <div class="input-wrapper">
      <input id="user-input" type="text" placeholder="Offer your thoughts..." autocomplete="off">
      <button class="send-btn" onclick="execute()">EXECUTE</button>
    </div>
  </div>
</div>

<script>
const theater = document.getElementById("theater");
const inputField = document.getElementById("user-input");
const moodLabel = document.getElementById("mood");
const energyLabel = document.getElementById("energy");

inputField.addEventListener("keypress", (e) => {
  if (e.key === "Enter") execute();
});

function addMessage(sender, text) {
  const isIgris = sender === "igris";
  const group = document.createElement("div");
  group.className = `msg-group ${isIgris ? 'igris-msg' : 'user-msg'}`;
  
  group.innerHTML = `
    <div class="msg-header">${isIgris ? 'Commander IGris' : 'Subject'}</div>
    <div class="msg-content">${text}</div>
  `;
  
  theater.appendChild(group);
  theater.scrollTop = theater.scrollHeight;
}

async function execute() {
  const text = inputField.value.trim();
  if (!text) return;

  addMessage("user", text);
  inputField.value = "";

  try {
    const res = await fetch("https://igris-the-crimson-counsil-api-production.up.railway.app/igris", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: text })
    });

    const data = await res.json();
    
    // Update interface vitals
    moodLabel.innerText = data.state.mood.toUpperCase();
    energyLabel.innerText = data.state.energy + "%";

    // Response delay for weight
    setTimeout(() => {
      addMessage("igris", data.IGris);
    }, 450);

  } catch (err) {
    addMessage("igris", "The shadow connection is unstable. Stand firm.");
  }
}
</script>

</body>
</html>
