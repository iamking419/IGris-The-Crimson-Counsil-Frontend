<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>IGRIS | Shadow Counsel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050505;
      --igris-red: #ff0000;
      --igris-red-dim: rgba(158, 0, 0, 0.3);
      --glass-bg: rgba(15, 15, 15, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #e2e2e2;
      --text-dim: #888;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Quicksand', sans-serif;
      height: 100dvh;
      width: 100vw;
      overflow: hidden; /* Lock the screen */
    }

    /* Animated Shadow Background */
    .shadow-background {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 50%, #1a0505 0%, #050505 100%);
      z-index: -1;
    }

    .shadow-aura {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%; left: -50%;
      background: radial-gradient(circle at center, var(--igris-red-dim) 0%, transparent 70%);
      animation: drift 10s infinite alternate ease-in-out;
      opacity: 0.4;
      pointer-events: none;
    }

    @keyframes drift {
      from { transform: translate(-10%, -10%) scale(1); }
      to { transform: translate(10%, 10%) scale(1.1); }
    }

    /* Main Container */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 500px;
      margin: 0 auto;
      position: relative;
      background: rgba(0,0,0,0.2);
    }

    /* Glassy Header */
    .header {
      padding: 20px;
      padding-top: calc(env(safe-area-inset-top) + 20px);
      background: var(--glass-bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      letter-spacing: 4px;
      margin: 0;
      color: #fff;
      text-shadow: 0 0 15px var(--igris-red);
    }

    .brand span {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--igris-red);
      font-weight: bold;
      display: block;
    }

    .status-box {
      font-family: monospace;
      font-size: 0.6rem;
      text-align: right;
      color: var(--text-dim);
    }

    /* The Chat Theater */
    .theater {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      /* Smoothly fades messages at the top */
      mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, black 100%);
      padding-bottom: 40px;
    }

    .theater::-webkit-scrollbar { width: 0px; }

    /* Messages glass style */
    .msg-group {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 2px;
      position: relative;
      animation: msgReveal 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    @keyframes msgReveal {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .igris-msg {
      align-self: flex-start;
      background: linear-gradient(135deg, rgba(40, 0, 0, 0.4), rgba(10, 10, 10, 0.6));
      border-left: 2px solid var(--igris-red);
      backdrop-filter: blur(5px);
    }

    .user-msg {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(30, 30, 30, 0.4), rgba(5, 5, 5, 0.6));
      border-right: 2px solid #444;
      text-align: right;
      backdrop-filter: blur(5px);
    }

    .msg-header {
      font-family: 'Cinzel', serif;
      font-size: 0.55rem;
      letter-spacing: 1.5px;
      margin-bottom: 5px;
      color: var(--igris-red);
    }

    .user-msg .msg-header { color: var(--text-dim); }

    .msg-content {
      font-size: 0.95rem;
      line-height: 1.5;
      font-weight: 300;
    }

    /* Input Zone - Glassmorphism */
    .input-area {
      padding: 15px 20px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 15px);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
    }

    .input-container {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 5px 18px;
      transition: all 0.3s ease;
    }

    .input-container:focus-within {
      border-color: var(--igris-red);
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.15);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 12px 0;
      font-family: 'Quicksand', sans-serif;
      font-size: 16px; /* Important: stops auto-zoom on iPhone */
      outline: none;
    }

    .send-btn {
      background: transparent;
      border: none;
      color: var(--igris-red);
      font-family: 'Cinzel', serif;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
      margin-left: 10px;
      padding: 5px;
    }

    .send-btn:active { transform: scale(0.9); opacity: 0.7; }

  </style>
</head>
<body>

<div class="shadow-background">
  <div class="shadow-aura"></div>
</div>

<div class="app-container">
  <header class="header">
    <div class="brand">
      <h1>IGRIS</h1>
      <span>SHADOW COUNSEL</span>
    </div>
    <div class="status-box">
      <div>SOUL: <span id="energy" style="color:var(--igris-red)">100%</span></div>
      <div id="mood">STOIC</div>
    </div>
  </header>

  <main id="theater" class="theater">
    <div class="msg-group igris-msg">
      <div class="msg-header">Commander Igris</div>
      <div class="msg-content">
        The shadows have converged. Speak your mind, Liege. I am listening.
      </div>
    </div>
  </main>

  <footer class="input-area">
    <div class="input-container">
      <input id="user-input" type="text" placeholder="Offer your thoughts..." autocomplete="off">
      <button class="send-btn" onclick="execute()">EXECUTE</button>
    </div>
  </footer>
</div>

<script>
const theater = document.getElementById("theater");
const inputField = document.getElementById("user-input");
const moodLabel = document.getElementById("mood");
const energyLabel = document.getElementById("energy");

// 1. AUTO-SCROLL WHEN TYPING (For Mobile Keyboard)
inputField.addEventListener("focus", () => {
  // Delay slightly to wait for the keyboard to slide up
  setTimeout(scrollToBottom, 300);
});

// 2. SCROLL LOGIC
function scrollToBottom() {
  theater.scrollTo({
    top: theater.scrollHeight,
    behavior: 'smooth'
  });
}

function addMessage(sender, text) {
  const isIgris = sender === "igris";
  const group = document.createElement("div");
  group.className = `msg-group ${isIgris ? 'igris-msg' : 'user-msg'}`;
  
  group.innerHTML = `
    <div class="msg-header">${isIgris ? 'Commander Igris' : 'The Monarch'}</div>
    <div class="msg-content">${text}</div>
  `;
  
  theater.appendChild(group);
  scrollToBottom();
}

// 3. HANDLE ENTER KEY
inputField.addEventListener("keypress", (e) => {
  if (e.key === "Enter") execute();
});

async function execute() {
  const text = inputField.value.trim();
  if (!text) return;

  addMessage("user", text);
  inputField.value = "";

  // Visual "Thinking" state
  energyLabel.style.opacity = "0.4";

  try {
    const res = await fetch("https://igris-the-crimson-counsil-api-production.up.railway.app/igris", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: text })
    });

    const data = await res.json();
    
    moodLabel.innerText = data.state.mood.toUpperCase();
    energyLabel.innerText = data.state.energy + "%";

    setTimeout(() => {
      addMessage("igris", data.IGris);
      energyLabel.style.opacity = "1";
    }, 600);

  } catch (err) {
    setTimeout(() => {
      addMessage("igris", "The connection to the shadow realm is weak... but I remain.");
      energyLabel.style.opacity = "1";
    }, 600);
  }
}
</script>

</body>
</html>
