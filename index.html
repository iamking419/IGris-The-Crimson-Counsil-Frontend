<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>IGRIS | Shadow Counsel</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #030303;
      --panel-bg: rgba(12, 12, 12, 0.95);
      --igris-red: #ff0000;
      --igris-glow: rgba(158, 0, 0, 0.5);
      --border-color: #222;
      --text-primary: #e2e2e2;
      --text-secondary: #888;
    }

    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Quicksand', sans-serif;
      height: 100dvh; /* Dynamic viewport height for mobile */
      width: 100vw;
      overflow: hidden; /* Prevent body scroll */
      display: flex;
      justify-content: center;
      background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
    }

    /* Scanline Effect Overlay */
    body::before {
      content: " ";
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
    }

    /* Main Interface */
    .interface {
      width: 100%;
      max-width: 500px; /* Desktop width */
      height: 100dvh;
      background: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,1);
      z-index: 5;
    }

    /* Top Bar */
    .top-bar {
      padding: 20px;
      padding-top: calc(env(safe-area-inset-top) + 20px); /* iOS Notch support */
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, #0f0f0f, #0c0c0c);
    }

    .brand h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      letter-spacing: 6px;
      margin: 0;
      color: #fff;
      text-shadow: 0 0 10px var(--igris-glow);
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; text-shadow: 0 0 10px var(--igris-glow); }
      50% { opacity: 0.8; text-shadow: 0 0 20px var(--igris-red); }
    }

    .brand span {
      font-size: 0.6rem;
      letter-spacing: 2px;
      color: var(--igris-red);
      font-weight: bold;
      display: block;
    }

    .vitals {
      text-align: right;
      font-family: monospace;
      font-size: 0.65rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .vitals span { color: #fff; text-shadow: 0 0 5px var(--igris-red); }

    /* Message Theater */
    .theater {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to bottom, transparent 0%, black 5%, black 95%, transparent 100%);
    }

    .theater::-webkit-scrollbar { width: 3px; }
    .theater::-webkit-scrollbar-thumb { background: var(--igris-red); }

    .msg-group {
      max-width: 90%;
      animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(15px); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    .msg-header {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .igris-msg { border-left: 2px solid var(--igris-red); padding-left: 15px; }
    .igris-msg .msg-header { color: var(--igris-red); }
    .igris-msg .msg-content { color: #ddd; line-height: 1.5; font-size: 0.95rem; }

    .user-msg { align-self: flex-end; text-align: right; border-right: 2px solid #444; padding-right: 15px; }
    .user-msg .msg-header { color: var(--text-secondary); }
    .user-msg .msg-content { color: #888; font-style: italic; font-size: 0.9rem; }

    /* Command Zone */
    .command-zone {
      padding: 20px;
      padding-bottom: calc(env(safe-area-inset-bottom) + 20px);
      background: #080808;
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border-color);
      padding: 5px 15px;
      border-radius: 4px;
      transition: 0.3s;
    }

    .input-wrapper:focus-within {
      border-color: var(--igris-red);
      box-shadow: 0 0 15px rgba(158, 0, 0, 0.2);
      background: rgba(255,255,255,0.05);
    }

    input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 12px 0;
      font-family: inherit;
      outline: none;
      font-size: 16px; /* Prevents iOS zoom on focus */
    }

    .send-btn {
      background: transparent;
      border: none;
      color: var(--igris-red);
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 2px;
      padding: 10px;
      transition: 0.3s;
    }

    .send-btn:active {
      transform: scale(0.9);
      text-shadow: 0 0 10px var(--igris-red);
    }

    /* Mobile specific adjustments */
    @media (max-width: 600px) {
      .interface {
        border-left: none;
        border-right: none;
      }
      .brand h1 { font-size: 1.1rem; }
      .msg-content { font-size: 0.9rem; }
    }
  </style>
</head>
<body>

<div class="interface">
  <header class="top-bar">
    <div class="brand">
      <h1>IGRIS</h1>
      <span>THE CRIMSON COUNSEL</span>
    </div>
    <div class="vitals">
      <div>STATUS: <span id="mood">STOIC</span></div>
      <div>SHADOW: <span id="energy">100%</span></div>
    </div>
  </header>

  <main id="theater" class="theater">
    <!-- Messages appear here -->
    <div class="msg-group igris-msg">
      <div class="msg-header">Commander Igris</div>
      <div class="msg-content">
        Your orders, Liege? My blade and counsel are yours.
      </div>
    </div>
  </main>

  <footer class="command-zone">
    <div class="input-wrapper">
      <input id="user-input" type="text" placeholder="Speak, My Lord..." autocomplete="off">
      <button class="send-btn" onclick="execute()">EXECUTE</button>
    </div>
  </footer>
</div>

<script>
const theater = document.getElementById("theater");
const inputField = document.getElementById("user-input");
const moodLabel = document.getElementById("mood");
const energyLabel = document.getElementById("energy");

// Handle enter key
inputField.addEventListener("keypress", (e) => {
  if (e.key === "Enter") execute();
});

function addMessage(sender, text) {
  const isIgris = sender === "igris";
  const group = document.createElement("div");
  group.className = `msg-group ${isIgris ? 'igris-msg' : 'user-msg'}`;
  
  group.innerHTML = `
    <div class="msg-header">${isIgris ? 'Commander Igris' : 'The Monarch'}</div>
    <div class="msg-content">${text}</div>
  `;
  
  theater.appendChild(group);
  
  // Smooth scroll to bottom
  setTimeout(() => {
    theater.scrollTo({
      top: theater.scrollHeight,
      behavior: 'smooth'
    });
  }, 100);
}

async function execute() {
  const text = inputField.value.trim();
  if (!text) return;

  addMessage("user", text);
  inputField.value = "";

  // Visual feedback for "processing"
  energyLabel.style.color = "var(--igris-red)";
  
  try {
    const res = await fetch("http://127.0.0.1:8000/igris", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ input: text })
    });

    const data = await res.json();
    
    // Update interface vitals
    moodLabel.innerText = data.state.mood.toUpperCase();
    energyLabel.innerText = data.state.energy + "%";

    // Strategic delay for a "tactical" feel
    setTimeout(() => {
      addMessage("igris", data.IGris);
      energyLabel.style.color = "#fff";
    }, 600);

  } catch (err) {
    setTimeout(() => {
      addMessage("igris", "The shadow connection wavers... I remain by your side despite the void.");
      energyLabel.style.color = "#fff";
    }, 600);
  }
}
</script>

</body>
</html>
